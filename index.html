<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PhishGuard — Multilingual Phishing Detector</title>
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2300f5a0'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='%23000'%3E🛡️%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    
    <style>
        :root {
            --bg: #0a0c14;
            --surface: #12151f;
            --surface2: #1a1f2e;
            --border: rgba(255,255,255,0.1);
            --accent: #00f5a0;
            --red: #ff4d4d;
            --text: #f0f2f8;
            --muted: #8a94b0;
            --radius: 16px;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            padding: 2.5rem 1rem 4rem;
        }
        .container { max-width: 760px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 2.5rem; }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 16px;
        }
        .logo-icon {
            width: 66px; height: 66px;
            background: linear-gradient(135deg, #00f5a0, #00c48a);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 0 40px rgba(0, 245, 160, 0.5);
        }
        .logo h1 {
            font-size: 39px;
            font-weight: 700;
            letter-spacing: -1.6px;
        }
        .logo h1 span { color: var(--accent); }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        textarea {
            width: 100%;
            min-height: 180px;
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            font-size: 16px;
            color: var(--text);
            line-height: 1.6;
        }
        textarea:focus {
            border-color: var(--accent);
        }

        .scan-btn {
            margin-top: 2rem;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #00f5a0, #00d49a);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Language Buttons */
        .lang-section { margin-top: 1.8rem; }
        .lang-row { display: flex; flex-wrap: wrap; gap: 10px; }
        .lang-btn {
            padding: 10px 22px;
            font-size: 14px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--muted);
            cursor: pointer;
            transition: all 0.25s;
        }
        .lang-btn:hover { border-color: var(--accent); color: var(--accent); }
        .lang-btn.active {
            background: rgba(0, 245, 160, 0.18);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Result */
        .result { display: none; margin-top: 2rem; }
        .verdict-card, .flags-card, .detail-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        .score-circle {
            width: 160px; height: 160px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: conic-gradient(var(--accent) 0deg, var(--accent) calc(var(--score) * 3.6deg), #222 calc(var(--score) * 3.6deg));
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .score-number { font-size: 48px; font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo">
            <div class="logo-icon">🛡️</div>
            <h1>Phish<span>Guard</span></h1>
        </div>
    </header>

    <div class="card">
        <div style="margin-bottom:12px; font-weight:600; color:var(--muted);">Paste suspicious message, URL, or email</div>
        
        <textarea id="msgInput" placeholder="Paste your suspicious message, email or URL here..."></textarea>

        <div class="lang-section">
            <span style="color:var(--muted);">Explain the risk in:</span>
            <div class="lang-row">
                <button class="lang-btn active" data-lang="English">English</button>
                <button class="lang-btn" data-lang="Hindi">हिंदी</button>
                <button class="lang-btn" data-lang="Telugu">తెలుగు</button>
                <button class="lang-btn" data-lang="Tamil">தமிழ்</button>
                <button class="lang-btn" data-lang="the same language as the input message">Auto</button>
            </div>
        </div>

        <button class="scan-btn" id="scanBtn" onclick="analyze()">🔍 Scan for Phishing</button>
    </div>

    <!-- Result -->
    <div class="result" id="result">
        <div class="verdict-card" id="verdictCard">
            <div id="scoreCircle" class="score-circle" style="--score: 0">
                <div class="score-circle-inner">
                    <div class="score-number" id="scoreNum">0</div>
                    <div style="font-size:13px;color:var(--muted);">RISK SCORE</div>
                </div>
            </div>
            <div class="verdict-emoji" id="verdictEmoji" style="font-size:52px;margin:12px 0;"></div>
            <div class="verdict-title" id="verdictTitle" style="font-size:26px;font-weight:700;"></div>
        </div>

        <div class="flags-card" id="flagsCard" style="display:none;">
            <h3 style="color:var(--red);">🔴 Red Flags Detected</h3>
            <div id="flagsList" style="margin-top:12px;"></div>
        </div>

        <div class="detail-card">
            <h3>📝 Explanation</h3>
            <div id="explanationBox" style="margin-top:12px;line-height:1.8;"></div>
        </div>

        <div class="detail-card">
            <h3>🛡️ Safety Tip</h3>
            <div id="tipBox" style="margin-top:12px;line-height:1.8;"></div>
        </div>
    </div>

    <!-- Follow-up Section -->
    <div class="followup-section" id="followupSection" style="display:none; margin-top:2.5rem; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:2rem;">
        <h3>Ask Follow-up Questions</h3>
        <div style="display:flex; gap:12px; margin-top:12px;">
            <textarea id="followupInput" placeholder="Why is this phishing? Explain in simple terms..." style="flex:1; min-height:52px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:14px;"></textarea>
            <button onclick="askFollowup()" style="padding:0 28px; background:var(--accent); color:#000; border:none; border-radius:12px; font-weight:600; cursor:pointer;">Ask</button>
        </div>
        <div id="followupResponse" style="margin-top:1rem; padding:1.2rem; background:var(--surface2); border-radius:12px; min-height:80px; display:none;"></div>
    </div>
</div>

<script>
let selectedLang = "English";
let currentAnalysis = "";

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedLang = btn.dataset.lang;
    });
});

async function analyze() {
    const msg = document.getElementById('msgInput').value.trim();
    if (!msg) {
        alert("Please paste a message first");
        return;
    }

    const scanBtn = document.getElementById('scanBtn');
    scanBtn.textContent = "Analyzing...";
    scanBtn.disabled = true;

    try {
        const res = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, language: selectedLang })
        });

        const r = await res.json();

        // Show result
        const verdict = (r.verdict || 'SUSPICIOUS').toUpperCase();
        const score = Math.min(100, Math.max(0, r.risk_score || 50));

        document.getElementById('scoreCircle').style.setProperty('--score', score);
        document.getElementById('scoreNum').textContent = score;

        document.getElementById('verdictEmoji').textContent = verdict === 'PHISHING' ? '🚨' : verdict === 'SUSPICIOUS' ? '⚠️' : '✅';
        document.getElementById('verdictTitle').textContent = verdict === 'PHISHING' ? 'Phishing Detected' : verdict === 'SUSPICIOUS' ? 'Suspicious' : 'Looks Safe';

        const flagsCard = document.getElementById('flagsCard');
        if (r.red_flags && r.red_flags.length > 0) {
            flagsCard.style.display = 'block';
            document.getElementById('flagsList').innerHTML = r.red_flags.map(f => `<div>• ${f}</div>`).join('');
        } else {
            flagsCard.style.display = 'none';
        }

        document.getElementById('explanationBox').textContent = r.explanation || "No explanation available.";
        document.getElementById('tipBox').textContent = r.safety_tip || "Never share OTPs or click suspicious links.";

        document.getElementById('result').style.display = 'block';
        document.getElementById('followupSection').style.display = 'block';

        currentAnalysis = msg;

    } catch (e) {
        alert("Analysis failed. Please check your internet connection and try again.");
    } finally {
        scanBtn.textContent = "🔍 Scan for Phishing";
        scanBtn.disabled = false;
    }
}

async function askFollowup() {
    const question = document.getElementById('followupInput').value.trim();
    if (!question) return;

    const box = document.getElementById('followupResponse');
    box.style.display = 'block';
    box.textContent = "Thinking...";

    try {
        const res = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: `Original: ${currentAnalysis}\nQuestion: ${question}`,
                language: selectedLang
            })
        });
        const r = await res.json();
        box.textContent = r.explanation || "No clear answer.";
    } catch (e) {
        box.textContent = "Sorry, couldn't get answer. Try again.";
    }
}
</script>
</body>
</html>
