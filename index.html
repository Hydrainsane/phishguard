<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PhishGuard — Multilingual Phishing Detector</title>
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2300f5a0'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='%23000'%3E🛡️%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5.0.5/dist/tesseract.min.js"></script>
    
    <style>
        :root {
            --bg: #0a0c14;
            --surface: #12151f;
            --surface2: #1a1f2e;
            --border: rgba(255,255,255,0.1);
            --accent: #00f5a0;
            --text: #f0f2f8;
            --muted: #8a94b0;
            --radius: 16px;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            padding: 2.5rem 1rem 4rem;
        }
        .container { max-width: 760px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 2.5rem; }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 16px;
        }
        .logo-icon {
            width: 66px; height: 66px;
            background: linear-gradient(135deg, #00f5a0, #00c48a);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 0 40px rgba(0, 245, 160, 0.5);
        }
        .logo h1 {
            font-size: 39px;
            font-weight: 700;
            letter-spacing: -1.6px;
        }
        .logo h1 span { color: var(--accent); }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        textarea {
            width: 100%;
            min-height: 180px;
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            font-size: 16px;
            color: var(--text);           /* Fixed: White text */
            line-height: 1.6;
        }
        textarea::placeholder { color: var(--muted); }
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 5px rgba(0, 245, 160, 0.15);
        }

        .input-tools {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            gap: 10px;
        }
        .tool-btn {
            width: 46px; height: 46px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .tool-btn:hover {
            background: var(--accent);
            color: #000;
        }

        .scan-btn {
            margin-top: 2rem;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #00f5a0, #00d49a);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        /* Result */
        .result { display: none; margin-top: 2rem; }
        .verdict-card, .flags-card, .detail-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        .score-circle {
            width: 160px; height: 160px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: conic-gradient(var(--accent) 0deg, var(--accent) calc(var(--score) * 3.6deg), #222 calc(var(--score) * 3.6deg));
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .score-number { font-size: 48px; font-weight: 700; color: var(--text); }

        .followup-section {
            margin-top: 2.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
        }
        .followup-input {
            display: flex;
            gap: 12px;
        }
        .followup-input textarea {
            flex: 1;
            background: var(--surface2);
            color: var(--text);           /* White text */
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
        }
        .ask-btn {
            padding: 0 24px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo">
            <div class="logo-icon">🛡️</div>
            <h1>Phish<span>Guard</span></h1>
        </div>
        <p class="tagline">Multilingual phishing detector for Hindi, Telugu, Tamil & English users</p>
    </header>

    <div class="card">
        <div style="margin-bottom:12px; font-weight:600; color:var(--muted);">Paste suspicious message, URL, or email</div>
        
        <div class="input-area" style="position:relative;">
            <textarea id="msgInput" placeholder="Paste your suspicious message, email or URL here..."></textarea>
            <div class="input-tools">
                <button class="tool-btn" id="micBtn" title="Voice Input">🎤</button>
                <button class="tool-btn" id="uploadBtn" title="Upload Screenshot">📸</button>
                <input type="file" id="imageInput" accept="image/*" style="display:none;">
            </div>
        </div>

        <div style="margin-top:1.5rem;">
            <span style="font-size:14px;color:var(--muted);">Explain the risk in:</span>
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
                <button class="lang-btn active" data-lang="English">English</button>
                <button class="lang-btn" data-lang="Hindi">हिंदी</button>
                <button class="lang-btn" data-lang="Telugu">తెలుగు</button>
                <button class="lang-btn" data-lang="Tamil">தமிழ்</button>
                <button class="lang-btn" data-lang="the same language as the input message">Auto</button>
            </div>
        </div>

        <button class="scan-btn" id="scanBtn" onclick="analyze()">🔍 Scan for Phishing</button>
    </div>

    <!-- Result Section -->
    <div class="result" id="result">
        <div class="verdict-card" id="verdictCard">
            <div id="scoreCircle" class="score-circle" style="--score: 0">
                <div class="score-circle-inner">
                    <div class="score-number" id="scoreNum">0</div>
                    <div style="font-size:13px;color:var(--muted);">RISK SCORE</div>
                </div>
            </div>
            <div class="verdict-emoji" id="verdictEmoji"></div>
            <div class="verdict-title" id="verdictTitle"></div>
        </div>

        <div class="flags-card" id="flagsCard" style="display:none;">
            <h3 style="color:var(--red);">🔴 Red Flags Detected</h3>
            <div id="flagsList" style="color:var(--text);"></div>
        </div>

        <div class="detail-card">
            <h3>📝 Explanation</h3>
            <div id="explanationBox" style="line-height:1.8; color:var(--text);"></div>
        </div>

        <div class="detail-card">
            <h3>🛡️ Safety Tip</h3>
            <div id="tipBox" style="line-height:1.8; color:var(--text);"></div>
        </div>
    </div>

    <!-- Follow-up Section -->
    <div class="followup-section" id="followupSection" style="display:none;">
        <h3>Ask Follow-up Questions</h3>
        <div class="followup-input">
            <textarea id="followupInput" placeholder="Why is this phishing? Explain in simple terms..."></textarea>
            <button class="ask-btn" onclick="askFollowup()">Ask</button>
        </div>
        <div id="followupResponse" style="margin-top:1rem; padding:1.2rem; background:var(--surface2); border-radius:12px; min-height:80px; display:none; color:var(--text);"></div>
    </div>
</div>

<script>
// Voice, Image, Analyze, etc.
let selectedLang = "English";
let currentAnalysis = "";

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedLang = btn.dataset.lang;
    });
});

// Voice
const micBtn = document.getElementById('micBtn');
let recognition;
if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'en-IN';
    recognition.onresult = e => document.getElementById('msgInput').value = e.results[0][0].transcript;
}
micBtn.addEventListener('click', () => recognition && recognition.start());

// Image OCR
const uploadBtn = document.getElementById('uploadBtn');
const imageInput = document.getElementById('imageInput');
uploadBtn.addEventListener('click', () => imageInput.click());
imageInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    uploadBtn.textContent = '⏳';
    try {
        const { createWorker } = Tesseract;
        const worker = await createWorker(['eng','hin','tel','tam']);
        const { data } = await worker.recognize(file);
        document.getElementById('msgInput').value = data.text.trim();
        await worker.terminate();
    } catch(err) {}
    uploadBtn.textContent = '📸';
});

async function analyze() {
    const msg = document.getElementById('msgInput').value.trim();
    if (!msg) return alert("Please paste a message");

    try {
        const res = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg, language: selectedLang })
        });

        const r = await res.json();

        // Show result
        const verdict = (r.verdict || 'SUSPICIOUS').toUpperCase();
        const score = Math.min(100, Math.max(0, r.risk_score || 50));

        document.getElementById('scoreCircle').style.setProperty('--score', score);
        document.getElementById('scoreNum').textContent = score;
        document.getElementById('verdictEmoji').textContent = verdict === 'PHISHING' ? '🚨' : verdict === 'SUSPICIOUS' ? '⚠️' : '✅';
        document.getElementById('verdictTitle').textContent = verdict === 'PHISHING' ? 'Phishing Detected' : verdict === 'SUSPICIOUS' ? 'Suspicious' : 'Looks Safe';

        document.getElementById('flagsList').innerHTML = (r.red_flags || []).map(f => `<div style="margin:6px 0;">• ${f}</div>`).join('');
        document.getElementById('flagsCard').style.display = (r.red_flags && r.red_flags.length) ? 'block' : 'none';

        document.getElementById('explanationBox').textContent = r.explanation || '';
        document.getElementById('tipBox').textContent = r.safety_tip || '';

        document.getElementById('result').style.display = 'block';
        document.getElementById('followupSection').style.display = 'block';

        currentAnalysis = msg;
    } catch (e) {
        alert("Analysis failed. Please try again.");
    }
}

async function askFollowup() {
    const q = document.getElementById('followupInput').value.trim();
    if (!q) return;

    const box = document.getElementById('followupResponse');
    box.style.display = 'block';
    box.textContent = "Thinking...";

    try {
        const res = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: `Original: ${currentAnalysis}\nQuestion: ${q}`,
                language: selectedLang
            })
        });
        const r = await res.json();
        box.textContent = r.explanation || r.safety_tip || "No clear answer.";
    } catch(e) {
        box.textContent = "Sorry, couldn't get answer.";
    }
}
</script>
</body>
</html>
