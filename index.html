<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PhishGuard — Multilingual Phishing Detector</title>
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2300f5a0'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='%23000'%3E🛡️%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5.0.5/dist/tesseract.min.js"></script>
    
    <style>
        :root {
            --bg: #0a0c14;
            --surface: #12151f;
            --surface2: #1a1f2e;
            --border: rgba(255,255,255,0.08);
            --accent: #00f5a0;
            --text: #f0f2f8;
            --muted: #8a94b0;
            --radius: 16px;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container { max-width: 760px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 16px;
        }
        .logo-icon {
            width: 66px; height: 66px;
            background: linear-gradient(135deg, #00f5a0, #00c48a);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 0 40px rgba(0, 245, 160, 0.5);
        }
        .logo h1 {
            font-size: 39px;
            font-weight: 700;
            letter-spacing: -1.6px;
        }
        .logo h1 span { color: var(--accent); }

        .chat-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            height: 72vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .chat-messages {
            flex: 1;
            padding: 1.8rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .message {
            max-width: 85%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.65;
            font-size: 15.5px;
        }
        .user-message {
            align-self: flex-end;
            background: var(--accent);
            color: #000;
            border-bottom-right-radius: 6px;
        }
        .ai-message {
            align-self: flex-start;
            background: var(--surface2);
            border: 1px solid var(--border);
        }

        .input-area {
            padding: 1.2rem;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            min-height: 54px;
            max-height: 140px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            font-size: 15.5px;
            resize: none;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .input-tools {
            display: flex;
            gap: 8px;
        }
        .tool-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tool-btn:hover {
            background: var(--accent);
            color: #000;
            transform: scale(1.1);
        }

        .send-btn {
            background: linear-gradient(90deg, #00f5a0, #00d49a);
            color: #000;
            border: none;
            padding: 0 26px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo">
            <div class="logo-icon">🛡️</div>
            <h1>Phish<span>Guard</span></h1>
        </div>
    </header>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="ai-message message">
                Hi! I'm PhishGuard.<br><br>
                Send any suspicious message, email, URL, or upload a screenshot.<br>
                After analysis, you can ask follow-up questions like:<br>
                • "Why is this phishing?"<br>
                • "Explain in simple Hindi"<br>
                • "Is the link safe?"
            </div>
        </div>

        <div class="input-area">
            <div class="input-tools">
                <button class="tool-btn" id="micBtn" title="Voice Input">🎤</button>
                <button class="tool-btn" id="uploadBtn" title="Upload Screenshot">📸</button>
                <input type="file" id="imageInput" accept="image/*" style="display:none;">
            </div>
            <textarea id="userInput" placeholder="Paste message or ask follow-up question..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>
</div>

<script>
const examples = [
    "Dear Customer, Your SBI account has been blocked. Click here to verify KYC immediately: http://sbi-kyc-update.xyz/verify",
    "అభినందనలు! మీరు 50 లక్షల లాటరీ గెలుచుకున్నారు. క్లిక్ చేయండి: http://lottery-win.tk/claim",
    "Your UPI transaction of Rs. 250 to Swiggy is successful. -HDFC Bank",
    "URGENT: Your Aadhaar-linked mobile number will expire today. Update now: http://uidai-update.ml/renew",
    "आपका OTP है 847291। इसे किसी के साथ साझा न करें।"
];

let selectedLang = "English";

// Add message to chat
function addMessage(text, isUser = false) {
    const chat = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

// Voice Input
const micBtn = document.getElementById('micBtn');
let recognition;
if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'en-IN';
    recognition.onresult = e => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
    };
}
micBtn.addEventListener('click', () => {
    if (recognition) {
        micBtn.style.background = '#ff4d4d';
        recognition.start();
        setTimeout(() => micBtn.style.background = 'var(--surface2)', 3000);
    } else {
        alert("Voice input works best in Chrome/Edge");
    }
});

// Image Upload + OCR
const uploadBtn = document.getElementById('uploadBtn');
const imageInput = document.getElementById('imageInput');

uploadBtn.addEventListener('click', () => imageInput.click());

imageInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    uploadBtn.textContent = '⏳';
    try {
        const { createWorker } = Tesseract;
        const worker = await createWorker(['eng','hin','tel','tam']);
        const { data } = await worker.recognize(file);
        document.getElementById('userInput').value = data.text.trim();
        await worker.terminate();
        alert("✅ Text extracted from image. Click Send.");
    } catch(err) {
        alert("Could not read the image clearly.");
    }
    uploadBtn.textContent = '📸';
});

// Send message
async function sendMessage() {
    const inputEl = document.getElementById('userInput');
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, true);
    inputEl.value = '';

    // Show loading
    const chat = document.getElementById('chatMessages');
    const loading = document.createElement('div');
    loading.className = "ai-message message";
    loading.textContent = "Analyzing...";
    chat.appendChild(loading);
    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch('/api/analyze', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                message: text,
                language: selectedLang
            })
        });

        const data = await res.json();
        chat.removeChild(loading);

        if (data.error) {
            addMessage("Sorry, I couldn't analyze that. Please try again.", false);
        } else {
            let response = `**Verdict:** ${data.verdict || 'SUSPICIOUS'} (${data.risk_score || 50}/100)\n\n`;
            response += data.explanation || "No explanation available.";
            if (data.safety_tip) response += `\n\n**Safety Tip:** ${data.safety_tip}`;
            
            addMessage(response, false);
        }
    } catch (err) {
        chat.removeChild(loading);
        addMessage("Connection error. Please check your internet and try again.", false);
    }
}

// Event Listeners
document.getElementById('sendBtn').addEventListener('click', sendMessage);

document.getElementById('userInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
</script>
</body>
</html>
